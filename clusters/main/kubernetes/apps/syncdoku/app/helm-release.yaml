apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: syncdoku
    namespace: syncdoku
spec:
    interval: 15m
    chart:
        spec:
            chart: app-template
            version: 18.23.4
            sourceRef:
                kind: HelmRepository
                name: truecharts
                namespace: flux-system
    releaseName: syncdoku
    values:
        TZ: Europe/Zurich
        image:
            repository: ghcr.io/qwal-1/syncdoku
            tag: 0.1.8
        imagePullSecret:
            ghcr:
                enabled: true
                targetSelectAll: true
                data:
                    registry: ghcr.io
                    username: ${GITHUB_USER}
                    password: ${GHCR_PULL_TOKEN}
                    email: ${DOMAIN_0_EMAIL}
        ingress:
            main:
                enabled: true
                ingressClassName: internal
                hosts:
                    - host: syncdoku.${DOMAIN_0}
                      paths:
                        - path: /
                          pathType: Prefix
        service:
            main:
                enabled: true
                ports:
                    main:
                        enabled: true
                        port: 8787
                        protocol: http
                        targetPort: 8787
                type: ClusterIP
        persistence:
            data:
                enabled: true
                mountPath: /app/data
